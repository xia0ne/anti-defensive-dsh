<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="dsh-anti-defensive-writing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1A33"/>
      <stop offset="55%" stop-color="#16294F"/>
      <stop offset="100%" stop-color="#234B8C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A8C7FA"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.7">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 80h1200M0 160h1200M0 240h1200"/>
    <path d="M200 0v320M400 0v320M600 0v320M800 0v320M1000 0v320"/>
  </g>

  <!-- left: document with strikethrough lines -->
  <g transform="translate(84 74)">
    <rect x="0" y="0" width="132" height="172" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <g stroke="#FF7A7A" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round">
      <path d="M18 40h96"/><path d="M18 66h74"/><path d="M18 92h88"/>
    </g>
    <g stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2.5" stroke-linecap="round">
      <path d="M18 120h64"/><path d="M18 144h80"/>
    </g>
    <circle cx="112" cy="132" r="20" fill="#FF7A7A" fill-opacity="0.14" stroke="#FF7A7A" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M104 124l16 16M120 124l-16 16" stroke="#FF7A7A" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- arrow -->
  <g transform="translate(252 148)">
    <path d="M0 0h74" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M58 -12l18 12-18 12" fill="none" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- right: clean document -->
  <g transform="translate(360 74)">
    <rect x="0" y="0" width="132" height="172" rx="10" fill="#FFFFFF" fill-opacity="0.10" stroke="#6EE7B7" stroke-opacity="0.42"/>
    <g stroke="#6EE7B7" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round">
      <path d="M18 40h96"/><path d="M18 66h84"/><path d="M18 92h72"/>
    </g>
    <g stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="2.5" stroke-linecap="round">
      <path d="M18 120h90"/><path d="M18 144h58"/>
    </g>
    <circle cx="112" cy="30" r="15" fill="#6EE7B7" fill-opacity="0.16" stroke="#6EE7B7" stroke-opacity="0.6" stroke-width="1.5"/>
    <path d="M105 30l5 5 10-11" fill="none" stroke="#6EE7B7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(540 96)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" letter-spacing="-0.8">dsh-anti-defensive-writing</text>
    <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#A8C7FA" fill-opacity="0.95" letter-spacing="0.2">论文是一场学术发布会，不是项目总结。</text>
    <text x="0" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#FFFFFF" fill-opacity="0.62">DeepSeek Harness plugin · skill + offline detector + writing-health dashboard</text>
    <!-- chips -->
    <g transform="translate(0 128)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13">
      <rect x="0" y="-17" width="112" height="28" rx="14" fill="#6EE7B7" fill-opacity="0.14" stroke="#6EE7B7" stroke-opacity="0.45"/>
      <text x="56" y="2" fill="#9BF0C6" text-anchor="middle">离线 · 零依赖</text>
      <rect x="122" y="-17" width="92" height="28" rx="14" fill="#A8C7FA" fill-opacity="0.14" stroke="#A8C7FA" stroke-opacity="0.45"/>
      <text x="168" y="2" fill="#C9DCFB" text-anchor="middle">中英双语</text>
      <rect x="224" y="-17" width="124" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.28"/>
      <text x="286" y="2" fill="#FFFFFF" fill-opacity="0.82" text-anchor="middle">MIT</text>
    </g>
  </g>
</svg>
